name: Check, build and publish White Horizon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: white-horizon-pages
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          pip install --require-hashes -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Browser QA
        run: |
          python -m http.server 4173 -d dist > /tmp/white-horizon-server.log 2>&1 &
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python tests/browser.py
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python tests/ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: white-horizon-qa
          path: test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: white-horizon-browser-build
          path: dist/
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report optional Pages setup
        if: steps.pages.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          The game build and QA completed. GitHub Pages needs initial repository-owner setup.
          Open Settings → Pages → Source: GitHub Actions, then rerun this workflow.
          The playable Sites deployment is https://aetherforge-white-horizon.banchisaverio.chatgpt.site (owner-private).
          REPORT
